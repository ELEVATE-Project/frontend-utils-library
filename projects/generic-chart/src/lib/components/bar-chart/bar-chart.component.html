@if (hasData()) {
  @if (isMobile()) {
    <div id="chartContainer" style="overflow-x: auto; width: 100%;">
      <div id="chartWrapper" style="display: inline-block; min-width: 600px;">
        <canvas id="MyChart" style="height: 450px; max-height: 450px;"></canvas>
      </div>
    </div>
    <div style="text-align: center;">
      {{ scrollLabel() }}
    </div>
  } @else {
    <div id="chartContainer">
      <canvas id="MyChart" style="width: 100%; height: 450px; max-height: 450px;"></canvas>
    </div>
  }
}
